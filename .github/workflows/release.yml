name: Build & Release Multiplatform

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 1.0.0)'
        required: false
        default: '1.0.0'

permissions:
  contents: write

jobs:
  
  # 1. LINUX DESKTOP (.deb, .rpm)
  
  build-linux:
    name: Build Linux (.deb, .rpm)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Install Linux Packaging Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm fakeroot alien

      - name: Make toolchain executable
        run: chmod +x ./kotlin

      - name: Build Executable JAR
        run: ./kotlin package -m desktopApp -f executable-jar

      - name: Package Linux .deb and .rpm Installers
        run: |
          VERSION="${{ github.ref_name }}"
          VERSION="${VERSION#v}"
          if [ -z "$VERSION" ] || [ "$VERSION" = "main" ] || [ "$VERSION" = "master" ]; then
            VERSION="${{ inputs.version || '1.0.0' }}"
          fi

          mkdir -p dist-input release-artifacts
          JAR_PATH=$(find build -name "desktopApp-jvm-executable.jar" | head -n 1)
          cp "$JAR_PATH" dist-input/mediacrush.jar

          echo "Packaging Debian (.deb)..."
          jpackage \
            --input dist-input \
            --name mediacrush \
            --main-jar mediacrush.jar \
            --main-class org.example.project.MainKt \
            --type deb \
            --app-version "$VERSION" \
            --linux-package-name mediacrush \
            --linux-shortcut \
            --dest release-artifacts/

          echo "Packaging RedHat (.rpm)..."
          jpackage \
            --input dist-input \
            --name mediacrush \
            --main-jar mediacrush.jar \
            --main-class org.example.project.MainKt \
            --type rpm \
            --app-version "$VERSION" \
            --linux-package-name mediacrush \
            --linux-shortcut \
            --dest release-artifacts/

          echo "Listing generated Linux artifacts:"
          ls -lh release-artifacts/

      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-artifacts
          path: release-artifacts/*

  
  # 2. WINDOWS DESKTOP (.msi, .exe)
  
  build-windows:
    name: Build Windows (.msi, .exe)
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Build Executable JAR
        shell: pwsh
        run: .\kotlin.bat package -m desktopApp -f executable-jar

      - name: Package Windows .msi and .exe Installers
        shell: pwsh
        run: |
          $ver = "${{ github.ref_name }}"
          if ($ver.StartsWith("v")) { $ver = $ver.Substring(1) }
          if (-not $ver -or $ver -eq "main" -or $ver -eq "master") {
            $ver = "${{ inputs.version }}"
            if (-not $ver) { $ver = "1.0.0" }
          }

          New-Item -ItemType Directory -Force -Path dist-input, release-artifacts
          $jar = (Get-ChildItem -Recurse -Filter "desktopApp-jvm-executable.jar").FullName | Select-Object -First 1
          Copy-Item $jar -Destination dist-input\mediacrush.jar

          Write-Host "Packaging Windows (.msi)..."
          jpackage `
            --input dist-input `
            --name "MediaCrush" `
            --main-jar mediacrush.jar `
            --main-class org.example.project.MainKt `
            --type msi `
            --app-version $ver `
            --win-shortcut `
            --win-menu `
            --dest release-artifacts

          Write-Host "Packaging Windows (.exe)..."
          jpackage `
            --input dist-input `
            --name "MediaCrush" `
            --main-jar mediacrush.jar `
            --main-class org.example.project.MainKt `
            --type exe `
            --app-version $ver `
            --win-shortcut `
            --win-menu `
            --dest release-artifacts

          Get-ChildItem release-artifacts

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-artifacts
          path: release-artifacts/*

  
  # 3. MACOS DESKTOP (.dmg, .pkg)
  
  build-macos:
    name: Build macOS (.dmg, .pkg)
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Make toolchain executable
        run: chmod +x ./kotlin

      - name: Build Executable JAR
        run: ./kotlin package -m desktopApp -f executable-jar

      - name: Package macOS .dmg and .pkg
        run: |
          VERSION="${{ github.ref_name }}"
          VERSION="${VERSION#v}"
          if [ -z "$VERSION" ] || [ "$VERSION" = "main" ] || [ "$VERSION" = "master" ]; then
            VERSION="${{ inputs.version || '1.0.0' }}"
          fi

          mkdir -p dist-input release-artifacts
          JAR_PATH=$(find build -name "desktopApp-jvm-executable.jar" | head -n 1)
          cp "$JAR_PATH" dist-input/mediacrush.jar

          echo "Packaging macOS (.dmg)..."
          jpackage \
            --input dist-input \
            --name "MediaCrush" \
            --main-jar mediacrush.jar \
            --main-class org.example.project.MainKt \
            --type dmg \
            --app-version "$VERSION" \
            --dest release-artifacts/

          echo "Packaging macOS (.pkg)..."
          jpackage \
            --input dist-input \
            --name "MediaCrush" \
            --main-jar mediacrush.jar \
            --main-class org.example.project.MainKt \
            --type pkg \
            --app-version "$VERSION" \
            --dest release-artifacts/

          echo "Listing generated macOS artifacts:"
          ls -lh release-artifacts/

      - name: Upload macOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-artifacts
          path: release-artifacts/*

  
  # 4. ANDROID (.apk, .aab)
  
  build-android:
    name: Build Android (.apk, .aab)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Accept Android SDK Licenses
        run: |
          mkdir -p "$ANDROID_HOME/licenses" || true
          echo "24333f8a63b6825ea9c5514f83c2829b004d1fee" > "$ANDROID_HOME/licenses/android-sdk-license" || true
          echo "d56f5187479451eabf01fb78af6dfcb131a6481e" >> "$ANDROID_HOME/licenses/android-sdk-license" || true
          echo "24333f8a63b6825ea9c5514f83c2829b004d1fee" > "$ANDROID_HOME/licenses/android-sdk-preview-license" || true
          echo "84831b9409646a918e30573bab4c9c91346d8abd" > "$ANDROID_HOME/licenses/android-sdk-preview-license" || true
          if command -v sdkmanager >/dev/null 2>&1; then
            yes | sdkmanager --licenses || true
          elif [ -f "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          elif [ -f "$ANDROID_HOME/cmdline-tools/16.0/bin/sdkmanager" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/16.0/bin/sdkmanager" --licenses || true
          fi

      - name: Make toolchain executable
        run: chmod +x ./kotlin

      - name: Build Android App (APK)
        run: ./kotlin build -m androidApp

      - name: Package Android App Bundle (AAB)
        run: ./kotlin package -m androidApp -f aab || true

      - name: Collect Android Artifacts
        run: |
          mkdir -p release-artifacts
          find build -name "*.apk" -exec cp {} release-artifacts/MediaCrush-Android.apk \; || true
          find build -name "*.aab" -exec cp {} release-artifacts/MediaCrush-Android.aab \; || true
          ls -lh release-artifacts/

      - name: Upload Android Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-artifacts
          path: release-artifacts/*

  
  # 5. PUBLISH GITHUB RELEASE
  
  publish-release:
    name: Create GitHub Release
    needs: [build-linux, build-windows, build-macos, build-android]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: all-artifacts
          merge-multiple: true

      - name: Generate Release Body with Analytics Badges
        run: |
          cat << 'EOF' > release_body.md
          ## MediaCrush Multiplatform Release

          [![Release Views](https://hits.seeyoufarm.com/api/count/incr/badge.svg?url=https%3A%2F%2Fgithub.com%2Frencelibrando%2FMediaCrush%2Freleases&count_bg=%233ECF8E&title_bg=%23121212&icon=&icon_color=%23E7E7E7&title=Release+Views&edge_flat=true)](https://github.com/rencelibrando/MediaCrush/releases)
          [![Total Downloads](https://img.shields.io/github/downloads/rencelibrando/MediaCrush/total?color=3ECF8E&label=Total+Downloads&style=flat-square)](https://github.com/rencelibrando/MediaCrush/releases)
          [![Latest Downloads](https://img.shields.io/github/downloads/rencelibrando/MediaCrush/latest/total?color=3ECF8E&label=Downloads&style=flat-square)](https://github.com/rencelibrando/MediaCrush/releases)

          ### Available Distribution Packages

          | Platform | Format | Description |
          | :--- | :--- | :--- |
          | **Linux (Debian / Ubuntu)** | `.deb` | Native Debian package with desktop menu shortcut |
          | **Linux (Fedora / RHEL)** | `.rpm` | Native RPM package |
          | **Windows (x64)** | `.msi` / `.exe` | Windows Installer or Setup Wizard |
          | **macOS (Universal)** | `.dmg` / `.pkg` | Drag-and-drop Disk Image or Installer |
          | **Android** | `.apk` / `.aab` | Direct sideload APK or Google Play Bundle |

          ---
          EOF

      - name: Determine Release Tag and Name
        id: rel_info
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
            echo "name=MediaCrush ${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=latest" >> "$GITHUB_OUTPUT"
            echo "name=MediaCrush Latest" >> "$GITHUB_OUTPUT"
          fi

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.rel_info.outputs.tag }}
          name: ${{ steps.rel_info.outputs.name }}
          body_path: release_body.md
          draft: false
          prerelease: false
          generate_release_notes: true
          make_latest: true
          files: all-artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
